aid: gireve
name: Gireve
description: 'Gireve is a B2B digital platform for electric-vehicle charging and new-mobility
  services, connecting charge point operators (CPOs), e-mobility service providers (eMSPs),
  and EV drivers across Europe. Its interoperability hub powers EV charging roaming, clearing
  and transaction settlement, Plug & Charge, smart charging, and mobility data services,
  spanning 680,000+ connected charging points and roughly one million monthly roaming
  transactions across 13,000+ signed agreements. Technical integration is delivered to
  connected operators over an OCPI-based hub through the Connect Place B2B platform;
  Gireve does not publish a public self-serve developer portal or OpenAPI specification.'
